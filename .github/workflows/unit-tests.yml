name: Offline unit tests

on:
  push:
    branches:
      - "feature/**"
      - "v1-solo"
  pull_request:
    branches:
      - "team-dev"
      - "main"
      - "v1-solo"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install --upgrade boto3
      - name: Check read-only AWS audit script syntax
        run: bash -n scripts/aws_predeploy_audit.sh
      - name: Validate workflow definition JSON
        run: python -m json.tool services/workflow/state_machine.asl.json > /dev/null
      - name: Install AWS SAM CLI for template validation
        run: python -m pip install --upgrade aws-sam-cli
      - name: Validate API SAM template
        run: sam validate --lint --template-file services/api/template.yaml
      - name: Validate workflow SAM template
        run: sam validate --lint --template-file services/workflow/template.yaml
      - name: Validate documents SAM template
        run: sam validate --lint --template-file services/documents/template.yaml
      - name: Validate stages SAM template
        run: sam validate --lint --template-file services/stages/template.yaml
      - name: Identity tests
        working-directory: services/identity
        run: python -m unittest -v
      - name: API tests
        working-directory: .
        run: python -m unittest services.api.test_handler -v
      - name: Workflow handler tests
        working-directory: services/workflow
        run: python -m unittest test_handler -v
      - name: Workflow callback tests
        working-directory: services/workflow
        run: python -m unittest test_callbacks -v
      - name: Documents service tests
        working-directory: .
        run: python -m unittest services.documents.test_handler -v
      - name: Stage service tests
        working-directory: .
        run: python -m unittest services.stages.test_handler -v
      - name: Onboarding journey integration tests
        working-directory: .
        run: python -m unittest tests.test_onboarding_integration -v
