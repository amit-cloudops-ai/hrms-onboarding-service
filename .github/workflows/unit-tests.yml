name: Offline unit tests
on:
  push:
    branches:
      - "feature/**"
      - "integration/**"
  pull_request:
    branches:
      - "team-dev"
      - "main"
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade boto3
      - name: Validate Step Functions definition
        run: python -m json.tool services/workflow/state_machine.asl.json > /dev/null
      - name: Install AWS SAM CLI
        run: python -m pip install --upgrade aws-sam-cli
      - name: Validate API template
        run: sam validate --lint --template-file services/api/template.yaml
      - name: Validate workflow template
        run: sam validate --lint --template-file services/workflow/template.yaml
      - name: Validate documents template
        run: sam validate --lint --template-file services/documents/template.yaml
      - name: Validate stages template
        run: sam validate --lint --template-file services/stages/template.yaml
      - name: Identity tests
        working-directory: services/identity
        run: python -m unittest -v
      - name: API tests
        run: python -m unittest services.api.test_handler -v
      - name: Workflow handler tests
        working-directory: services/workflow
        run: python -m unittest test_handler -v
      - name: Workflow callback tests
        working-directory: services/workflow
        run: python -m unittest test_callbacks -v
      - name: Document service tests
        working-directory: services/documents
        run: python -m unittest -v
      - name: WP4 business adapter tests
        run: python -m unittest services.stages.test_stages -v

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/portal/package-lock.json
            frontend/hr-dashboard/package-lock.json
      - name: Build employee portal
        working-directory: frontend/portal
        run: npm ci && npm run build
      - name: Build HR dashboard
        working-directory: frontend/hr-dashboard
        run: npm ci && npm run build

      - name: Validate team CloudFormation infrastructure
        run: |
          python -m pip install --upgrade cfn-lint
          cfn-lint infra/team-dev-foundation.yaml infra/team-dev-hosting.yaml
      - name: Validate deployment script syntax
        run: bash -n infra/deploy-team-dev.sh
      - name: Build all backend SAM applications without deploying
        run: |
          sam build --template-file services/stages/template.yaml --build-dir /tmp/sam-wp4
          sam build --template-file services/workflow/template.yaml --build-dir /tmp/sam-wp2
          sam build --template-file services/documents/template.yaml --build-dir /tmp/sam-wp3
          sam build --template-file services/api/template.yaml --build-dir /tmp/sam-api
