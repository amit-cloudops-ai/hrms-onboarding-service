name: Offline unit tests

on:
  push:
    branches:
      - "feature/**"
  pull_request:
    branches:
      - "team-dev"
      - "main"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install --upgrade boto3
      - name: Identity tests
        working-directory: services/identity
        run: python -m unittest -v
      - name: API tests
        working-directory: .
        run: python -m unittest services.api.test_handler -v
      - name: Workflow handler tests
        working-directory: services/workflow
        run: python -m unittest test_handler -v
      - name: Workflow callback tests
        working-directory: services/workflow
        run: python -m unittest test_callbacks -v
