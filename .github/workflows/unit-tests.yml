name: Offline unit tests
on:
  push:
    branches:
      - "feature/**"
      - "integration/**"
  pull_request:
    branches:
      - "team-dev"
      - "main"
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade boto3
      - name: Validate Step Functions definition
        run: python -m json.tool services/workflow/state_machine.asl.json > /dev/null
      - name: Install AWS SAM CLI
        run: python -m pip install --upgrade aws-sam-cli
      - name: Validate API template
        run: sam validate --lint --template-file services/api/template.yaml
      - name: Validate workflow template
        run: sam validate --lint --template-file services/workflow/template.yaml
      - name: Validate documents template
        run: sam validate --lint --template-file services/documents/template.yaml
      - name: Validate stages template
        run: sam validate --lint --template-file services/stages/template.yaml
      - name: Identity tests
        working-directory: services/identity
        run: python -m unittest -v
      - name: API tests
        run: python -m unittest services.api.test_handler -v
      - name: Workflow handler tests
        working-directory: services/workflow
        run: python -m unittest test_handler -v
      - name: Workflow callback tests
        working-directory: services/workflow
        run: python -m unittest test_callbacks -v
      - name: Document service tests
        working-directory: services/documents
        run: python -m unittest -v
      - name: WP4 business adapter tests
        run: python -m unittest services.stages.test_stages -v
