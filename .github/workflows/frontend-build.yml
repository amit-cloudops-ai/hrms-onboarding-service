name: Frontend build validation
on:
  push:
    branches: [v1-solo]
    paths:
      - 'frontend/portal/**'
      - 'frontend/hr-dashboard/**'
      - '.github/workflows/frontend-build.yml'
  workflow_dispatch:
jobs:
  build-frontends:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [portal, hr-dashboard]
    defaults:
      run:
        working-directory: frontend/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/${{ matrix.app }}/package.json
      - run: npm install
      - run: npm run build
